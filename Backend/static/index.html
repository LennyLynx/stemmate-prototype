<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2d4a">
<title>STEMMate Namibia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <strong>STEMMate Namibia</strong>
  <span id="who" class="chip" hidden></span>
</header>
<div id="banner" class="banner online" role="status"></div>
<div class="demo-row">
  <button id="demoOffline" class="link-btn" type="button" aria-pressed="false">Demo: pretend to be offline</button>
</div>
<main id="main" tabindex="-1"><div id="app"></div></main>
<div id="live" class="sr-only" aria-live="polite" role="status"></div>
<nav id="nav" aria-label="Main" hidden>
  <button type="button" data-go="home">Home</button>
  <button type="button" data-go="activities">Activities</button>
  <button type="button" data-go="plans">Plans</button>
  <button type="button" data-go="account">Account</button>
</nav>
<noscript><p style="padding:16px">STEMMate needs JavaScript to run.</p></noscript>
<script src="stemmate-client.js"></script>
<script src="app.js"></script>
</body>
</html>
