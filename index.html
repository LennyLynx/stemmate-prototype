<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2d4a">
<title>STEMMate Namibia</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui;background:#f6f7fb;max-width:440px;margin:auto;min-height:100vh;padding-bottom:88px;border-left:1px solid #e5e7eb;border-right:1px solid #e5e7eb}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f2d4a;color:#fff;position:sticky;top:0;z-index:20}
.banner{padding:10px;text-align:center;font-size:13px;cursor:pointer;font-weight:700}
.online{background:#dcfce7;color:#166534} .offline{background:#fee2e2;color:#991b1b}
.hero{padding:20px 16px 6px} .hero h2{margin:0;color:#0f2d4a;font-size:26px;line-height:1.15}
.card{background:#fff;border:1px solid #eef2f7;border-radius:18px;padding:16px;margin:10px 12px;box-shadow:0 8px 20px rgba(15,45,74,.06)}
.pills{display:flex;gap:8px;overflow:auto;padding:10px 2px}
.pill{border-radius:999px;padding:8px 16px;border:1px solid #e2e8f0;background:#fff;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.pill.active{background:#0f2d4a;color:#fff;border-color:#0f2d4a}
.pill:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, .bottom button:focus-visible{outline:3px solid #0f2d4a;outline-offset:2px;box-shadow:0 0 0 4px rgba(15,45,74,.18)}
.btn{width:100%;padding:13px;border-radius:14px;border:none;font-weight:800;cursor:pointer;font-size:14px}
.btn-primary{background:#0f2d4a;color:#fff;box-shadow:0 8px 18px rgba(15,45,74,.22)} .btn-light{background:#f1f5f9;color:#0f2d4a}
input,textarea{width:100%;padding:12px 14px;margin-top:6px;border:1.5px solid #e2e8f0;border-radius:12px;background:#fbfdff;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:#0f2d4a;background:#fff}
label{font-size:11px;font-weight:800;color:#334155;margin-top:14px;display:block;text-transform:uppercase;letter-spacing:.5px}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:auto;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:8px 8px 16px;border-radius:22px 22px 0 0;z-index:20}
.bottom button{background:transparent;border:none;font-size:11px;font-weight:800;color:#64748b;padding:8px 18px;border-radius:12px}
.bottom button.active{color:#0f2d4a;background:#f1f5f9}
.toast{background:#dcfce7;color:#166534;padding:11px 12px;margin-top:12px;border-radius:12px;font-size:13px;font-weight:700;border:1px solid #bbf7d0}
.badge{font-size:11px;padding:5px 10px;border-radius:999px;font-weight:800}
.pending{background:#fef9c3;color:#854d0e;border:1px solid #fde68a} .failed{background:#fee2e2;color:#991b1b;border:1px solid #fecaca} .synced{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
small.muted{color:#64748b}
</style>
</head>
<body>
<header><b>STEMMate Namibia</b><span id="netTxt" style="font-size:11px;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px">Online</span></header>
<div id="banner" class="banner online">● Online - Tap to go offline</div>
<div id="app"></div>
<div class="bottom">
<button id="bHome" class="active" onclick="home()">🏠<br>Home</button>
<button id="bAct" onclick="activities()">📚<br>Activities</button>
<button id="bPlans" onclick="plans()">🗂️<br>Plans</button>
</div>
<script>
const acts=[
{id:1,title:"Paper Bridge Challenge",level:"Beginner",duration:"30 min",desc:"Build strong bridges with paper"},
{id:2,title:"Vinegar & Baking Soda",level:"Beginner",duration:"45 min",desc:"Fun chemistry eruption"},
{id:3,title:"Pendulum Patterns",level:"Intermediate",duration:"90 min",desc:"Art with physics"},
{id:4,title:"Advanced Robotics",level:"Advanced",duration:"90 min",desc:"Code a simple bot"}
];
let online=true;
function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setBottom(id){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active')); document.getElementById(id).classList.add('active')}
function home(){
setBottom('bHome');
document.getElementById('app').innerHTML=`
<div class="hero"><h2>Hello, Teacher 👋<br><span style="font-weight:500;font-size:18px;color:#475569">What do you want to do today?</span></h2></div>
<div class="card" onclick="activities()"><b>1. Browse activities</b><br><small class="muted">Find a lesson • Works offline</small></div>
<div class="card" onclick="newPlan()"><b>2. Create a plan</b><br><small class="muted">Start a new lesson plan - 6 fields auto-save</small></div>
<div class="card" onclick="plans()"><b>3. View saved plans</b><br><small class="muted">Pending Sync / Failed Sync / Synced</small></div>`;
}
function activities(){
setBottom('bAct');
document.getElementById('app').innerHTML=`
<div style="padding:16px"><h3 style="margin:0;color:#0f2d4a">Activities</h3><small class="muted">Pick a lesson to teach. You can use it even without internet</small>
<div class="pills"><button class="pill active" data-f="">All</button><button class="pill" data-f="Beginner">Beginner</button><button class="pill" data-f="Intermediate">Intermediate</button><button class="pill" data-f="Advanced">Advanced</button></div>
<div id="list"></div></div>`;
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active')); p.classList.add('active'); render(p.dataset.f);});
render('');
}
function render(f){
const list=document.getElementById('list'); if(!list) return;
list.innerHTML=acts.filter(a=>!f||a.level===f).map(a=>`
<div class="card"><b>${esc(a.title)}</b><br><small class="muted">${esc(a.desc)}</small><br><span class="badge ${a.level==='Beginner'?'synced':a.level==='Intermediate'?'pending':'failed'}">${a.level}</span> <small class="muted">• ${a.duration}</small>
<button class="btn btn-light" style="margin-top:12px" onclick="savePhone(${a.id})">⬇️ Save to phone</button><div id="msg${a.id}"></div></div>`).join('');
}
function savePhone(id){
try{localStorage.setItem('offline_'+id,'saved'); document.getElementById('msg'+id).innerHTML=`<div class="toast">✅ Saved to phone!</div>`;}catch(e){alert('Storage full');}
}
function newPlan(){
setBottom('bHome');
document.getElementById('app').innerHTML=`
<div style="padding:16px"><h3 style="margin:0;color:#0f2d4a">New Lesson Plan</h3><small class="muted">This saves automatically. It will not be lost if you close the app</small>
<label>1. Title</label><input id="t" placeholder="Name of the lesson">
<label>2. Steps</label><textarea id="s" rows="3" placeholder="What will the students do?"></textarea>
<label>3. Time Needed</label><input id="ti" placeholder="How many minutes?">
<label>4. Materials</label><input id="m" placeholder="What items do you need?">
<label>5. Safety</label><input id="sa" placeholder="Any safety rules?">
<label>6. Inclusion</label><input id="in" placeholder="How to include all students">
<button class="btn btn-primary" style="margin-top:18px" onclick="saveP()">💾 Save Plan</button><div id="pmsg"></div></div>`;
}
// === FR-03 FIX: Saves ALL 6 fields - no data loss ===
function saveP(){
  const title=(document.getElementById('t')?.value||'').trim()||'Untitled Lesson';
  const steps=document.getElementById('s')?.value||'';
  const time=document.getElementById('ti')?.value||'';
  const id=Date.now()+'_'+Math.floor(Math.random()*1000);
  try{
    localStorage.setItem('plan_'+id, JSON.stringify({
      id, title, steps, time,
      materials: document.getElementById('m')?.value||'',
      safety: document.getElementById('sa')?.value||'',
      inclusion: document.getElementById('in')?.value||'',
      status:'pending', created:Date.now()
    }));
    const pmsg=document.getElementById('pmsg');
    if(pmsg) pmsg.innerHTML=`<div class="toast">✅ Saved to phone. Will upload later.</div>`;
  }catch(e){alert('Could not save - storage full');}
}
function getPlans(){return Object.keys(localStorage).filter(k=>k.startsWith('plan_')).map(k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}}).filter(Boolean).sort((a,b)=>b.created-a.created);}
function plans(){
setBottom('bPlans');
let ps=getPlans();
let html=`<div style="padding:16px"><h3 style="margin:0;color:#0f2d4a">My Plans • ${ps.length}</h3><small class="muted">Check if your plans are uploaded</small>`;
if(ps.length===0) html+=`<div class="card" style="text-align:center;padding:28px">No plans yet</div>`;
ps.forEach(p=>{
html+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(p.title)}</b><span class="badge ${p.status}">${p.status==='pending'?'Pending Sync':p.status==='failed'?'Failed Sync':'Synced'}</span></div><small class="muted">Saved: Just now</small>
${p.status!=='synced'?`<div style="background:#fef2f2;border:1px solid #fee2e2;padding:10px;border-radius:12px;margin-top:10px"><p style="color:#991b1b;font-size:12px;margin:0 0 8px;font-weight:700">⚠️ Wait: There is a newer version online</p><button class="btn btn-primary" onclick="keepO('${p.id}')">Keep Online Version</button><button class="btn btn-light" style="margin-top:6px" onclick="keepM('${p.id}')">Keep My Phone Version</button></div>`:''}
${p.status==='synced'?`<small class="muted"><br>Materials: ${esc(p.materials||'')} | Safety: ${esc(p.safety||'')} | Inclusion: ${esc(p.inclusion||'')}</small>`:''}
</div>`;
});
html+=`</div>`; document.getElementById('app').innerHTML=html;
}
function keepM(id){try{const k='plan_'+id; const p=JSON.parse(localStorage.getItem(k)); if(p){p.status='synced'; localStorage.setItem(k,JSON.stringify(p));}}catch{} plans();}
function keepO(id){try{const k='plan_'+id; const p=JSON.parse(localStorage.getItem(k)); if(p){p.status='synced'; localStorage.setItem(k,JSON.stringify(p));}}catch{} plans();}
document.getElementById('banner').onclick=()=>{
online=!online;
const b=document.getElementById('banner'); b.className='banner '+(online?'online':'offline');
b.textContent=online?'● Online - Tap to go offline':'● Offline - We will save your work to the phone';
document.getElementById('netTxt').textContent=online?'Online':'Offline';
};
home();
</script>
</body>
</html>
